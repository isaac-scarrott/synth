<!DOCTYPE html>
<!-- The share card, rendered to site/img/share-card.png by site/og/render.js.

     This is the one picture on the site that is drawn rather than photographed. Everything in
     site/capture/ is the running app; a card is read at a thumbnail's size in a feed — Slack
     unfurls at ~360px, iMessage at ~270px — so what it can carry is the sentence and the domain,
     with the product behind them as texture rather than as a figure anyone is asked to read.

     The tokens below are copied from index.html's :root, which carries them inline. Change a
     colour there and change it here. -->
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Geist"; src: url("../fonts/Geist-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }

  :root {
    --canvas: #0d0f13;
    --ink: #e6e8ed;
    --ink-meta: #8d9099;
    --ink-faint: #7f838c;
    --hair: rgba(255,255,255,0.06);
    --line: rgba(255,255,255,0.13);
    --accent: #f1ddd7;
    --accent-rgb: 241,221,215;
    --font: "Geist", -apple-system, system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: var(--canvas); color: var(--ink); overflow: hidden; position: relative;
    font: 400 16px/1.5 var(--font); letter-spacing: -0.01em;
    -webkit-font-smoothing: antialiased;
  }

  /* The hero's own champagne wash and structural rails, so the card is recognisably the same
     object as the page it unfurls. */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(58% 62% at 50% 0%, rgba(var(--accent-rgb), 0.085), transparent 72%);
  }
  .rail { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--hair); }
  .rail--l { left: 80px; } .rail--r { right: 80px; }

  .card {
    position: relative; height: 100%; padding: 76px 80px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }

  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 52px; height: 52px; }
  .brand span { font-size: 36px; font-weight: 550; letter-spacing: -0.02em; }

  /* The <title> and og:title verbatim, its hyphen resolved to a full stop, so the picture and
     the text beside it say one thing.

     68px puts the longer line at 746px, which is wider than the middle 630px a square crop
     keeps — sized to survive that it would have to come down to 56px. It is not worth it: every
     surface that renders this card at a readable size (Slack, X, iMessage, LinkedIn, Discord)
     lays it out at 1.91:1, and the ones that crop to a square show it at around 100px, where no
     type survives anyway. Sized for the surfaces that can actually read it. */
  h1 {
    margin-top: 54px;
    font-size: 68px; font-weight: 500; line-height: 1.12; letter-spacing: -0.024em;
  }
  /* The page dims this clause with --ink-meta. Grey at a thumbnail's scale is gone; champagne
     is the one place on the card where colour earns its keep. */
  h1 .turn { color: var(--accent); }

  .kinds {
    margin-top: 30px; font-size: 30px; letter-spacing: -0.01em; color: var(--ink-meta);
  }
  .kinds i { font-style: normal; color: rgba(var(--accent-rgb), 0.45); padding: 0 4px; }

  /* Off the centre line on purpose: it anchors the card, and a fourth centred line reads as a
     conference poster. */
  .url {
    position: absolute; left: 80px; bottom: 56px;
    font-size: 26px; font-weight: 500; color: var(--ink-faint);
  }

  /* The app itself, bled off the bottom-right corner. It is texture, not a figure: at this size
     the app's own 14pt chrome renders around 6px, so the only thing it can say is "a real Mac
     window", and it says that from the silhouette alone. Everything above the fold line is
     dissolved into the canvas so it never competes with the sentence. */
  .shot {
    position: absolute; right: -300px; bottom: -300px; width: 880px;
    border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  }
  .shot img { display: block; width: 100%; filter: saturate(0.35) brightness(0.5); }
  .shot::after {
    content: ""; position: absolute; inset: 0;
    background:
      linear-gradient(0deg, rgba(13,15,19,0.5) 0%, rgba(13,15,19,0.97) 62%),
      linear-gradient(90deg, rgba(13,15,19,0.94) 0%, transparent 42%);
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="rail rail--l"></div>
  <div class="rail rail--r"></div>

  <div class="shot"><img src="../img/hero-dark@2x.png" alt="" /></div>

  <div class="card">
    <div class="brand"><img src="../img/mark-light.png" alt="" /><span>Synth</span></div>
    <h1>Run every coding agent.<br /><span class="turn">Commit to none of them.</span></h1>
    <p class="kinds">Claude Code<i>·</i>OpenCode<i>·</i>Antigravity<i>·</i>your own</p>
    <span class="url">trysynth.dev</span>
  </div>
</body>
</html>
